name: Validate Agent Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify shared files are in sync across skills
        run: python3 scripts/sync_shared.py --check

      - name: Run skill packaging and validator tests
        run: python3 -m unittest discover -s tests -v
